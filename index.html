<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Overhead Cabin</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202e;--mute:#6b7685;--line:#e3e6ea;--acc:#1f6f8b;--accink:#fff;--good:#1b7f4b;--warn:#b86e00;--bad:#b3261e;--info:#4a56c4;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#18222f;--ink:#e8edf3;--mute:#93a0b0;--line:#26323f;--acc:#4aa8c8;--accink:#06202b;--good:#52c487;--warn:#f0a840;--bad:#ff8a80;--info:#97a1ff;--chip:#223040}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;min-width:0}
header small{display:block;color:var(--mute);font-size:11px;font-weight:400}
button{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:8px 12px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btns{display:flex;gap:8px;margin-top:8px}.btns .btn{flex:1}
main{flex:1;overflow-y:auto;padding:4px 14px 130px;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:11px;color:var(--mute)}
nav button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;border:0;background:var(--acc);color:var(--accink);font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.card.s-buy{border-left:4px solid var(--warn)}.card.s-done{border-left:4px solid var(--good)}.card.s-out{border-left:4px solid var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid .card{margin:0}
.k{color:var(--mute);font-size:12px}
.v{font-size:20px;font-weight:700}
.sec{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:600;margin-left:6px;white-space:nowrap}
.chip.good,.t-done{color:var(--good)}.chip.warn,.t-buy{color:var(--warn)}.chip.bad,.t-out{color:var(--bad)}.chip.info{color:var(--info)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0}
input[readonly]{opacity:.6}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.item{cursor:pointer}
.sub{color:var(--mute);font-size:12px}
.det{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.det div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.det div span:first-child{color:var(--mute)}
.det div span:last-child{text-align:right;word-break:break-word}
.muted{opacity:.55}
.toast{color:var(--mute);font-size:12px;padding:0 2px 8px}
.hint{color:var(--info);font-size:12px;margin:-4px 0 8px;min-height:0}
.err{color:var(--bad);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.tgl{display:flex;align-items:center;gap:8px;margin:0 2px 10px;color:var(--mute);font-size:13px}
.nm{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nm .chip,.chips .chip{margin-left:0}.customer-type{color:var(--mute);font-size:13px;font-weight:500;margin-left:2px}
.chips .chip{padding:3px 10px;font-size:12px}
.step{display:flex;gap:8px;align-items:center}.step input{margin:4px 0 8px}.step .btn{margin-bottom:4px;padding:10px 16px}
a{color:var(--acc)}
.invoice-paper{background:#fff;color:#16202e;border:1px solid #e3e6ea;border-radius:12px;padding:18px;margin:10px 0;font-family:Garet,Arial,sans-serif}
.invoice-brand{font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.04em;font-size:20px;line-height:1.15}.invoice-logo{display:block;width:128px;height:auto;max-width:45%;object-fit:contain}
.invoice-brand small{display:block;font-size:10px;letter-spacing:.18em;font-weight:400;margin-top:5px}
.invoice-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}.invoice-table th,.invoice-table td{border-bottom:1px solid #e3e6ea;padding:8px 4px;text-align:left}.invoice-table th:last-child,.invoice-table td:last-child{text-align:right}
@media print{body *{visibility:hidden}.invoice-paper,.invoice-paper *{visibility:visible}.invoice-paper{position:absolute;left:0;top:0;width:100%;margin:0;border:0}}

</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){return typeof v==='number'?v:(v===''||v==null?null:Number(v))};
var bad=function(n){return n==null||isNaN(n)};
var rp=function(v){var n=num(v);return bad(n)?'-':'Rp '+Math.round(n).toLocaleString('id-ID')};
var yen=function(v){var n=num(v);return bad(n)?'-':'\u00a5'+n.toLocaleString('en-US')};
var pct=function(v){var n=num(v);return bad(n)?'-':Math.round(n*100)+'%'};
var val=function(v){return v===''||v==null?'-':esc(v)};
var today=function(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)};
var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

var S={tab:'home',q:'',onlyBuy:false,open:{},msg:'',loading:false,setup:false,invoiceCustomer:''};
var cfg={url:ls.get('oc_url')||'',key:ls.get('oc_key')||''};
var D=null,AT=ls.get('oc_at'),Q=[],VW=null,form=null;
try{D=JSON.parse(ls.get('oc_data')||'null')}catch(e){D=null}
try{Q=JSON.parse(ls.get('oc_queue')||'[]')}catch(e){Q=[]}
var saveQ=function(){ls.set('oc_queue',JSON.stringify(Q))};

/* ---------- helpers on data ---------- */
function lc(s){return String(s==null?'':s).trim().toLowerCase()}
function by(arr,key,name){var n=lc(name);if(!n)return null;for(var i=0;i<arr.length;i++)if(lc(arr[i][key])===n)return arr[i];return null}
function selling(s,yenP,sur,manual){var m=num(manual);if(m>0)return m;var y=num(yenP);if(!(y>0))return '';
 var base=y<=num(s.threshold)?y*num(s.t1Rate)+num(s.t1Fee):y*num(s.t2Rate);return base+(num(sur)||0)}
function applyQueue(d,q){
 var v=JSON.parse(JSON.stringify(d)),s=v.settings;
 q.forEach(function(it){var x=it.data,c,p,o,sh;
  if(it.action==='addCustomer'){if(!by(v.customers,'name',x.name))v.customers.push({name:x.name,type:x.type||'New',contact:x.contact||'',address:x.address||'',courier:x.courier||'',units:0,bought:0,waiting:0,toBuy:0,billable:0,itemsPaid:0,shipFee:x.shipFee||'',shipPaid:0,balance:0,payStatus:'No order',status:x.status||'Shopping',next:'No items yet',notes:x.notes||'',pending:true})}
  else if(it.action==='updateCustomer'){c=by(v.customers,'name',x.name);if(c){['type','contact','address','courier','shipFee','status','notes'].forEach(function(k){if(k in x)c[k]=x[k]});c.pending=true}}
  else if(it.action==='addProduct'){if(!by(v.products,'name',x.name))v.products.push({name:x.name,store:x.store||'',yen:x.yen,surcharge:x.surcharge,manualIdr:x.manualIdr,link:x.link||'',ig:x.ig||'Not posted',notes:x.notes||'',selling:selling(s,x.yen,x.surcharge,x.manualIdr),ordered:0,pending:true})}
  else if(it.action==='updateProduct'){p=by(v.products,'name',x.name);if(p){['store','yen','surcharge','manualIdr','link','ig','notes'].forEach(function(k){if(k in x)p[k]=x[k]});p.selling=selling(s,p.yen,p.surcharge,p.manualIdr);p.pending=true}}
  else if(it.action==='addStore'){if(s.stores.map(lc).indexOf(lc(x.name))<0)s.stores.push(x.name)}
  else if(it.action==='addOrder'){p=by(v.products,'name',x.product);var u=p?p.selling:selling(s,x.yen,x.surcharge,'');
   v.orders.push({customer:x.customer,product:x.product,qty:x.qty,note:x.note||'',date:x.date,cancel:'',unit:u,gross:u===''?'':u*x.qty,bought:'',toBuy:'',waiting:'',status:'Pending',pending:true})}
  else if(it.action==='updateOrder'||it.action==='cancelOrder'){o=null;v.orders.forEach(function(r){if(r.row===x.row)o=r});
   if(o){if(it.action==='cancelOrder'){o.cancel='Yes';o.status='Cancelled'}else{if('qty' in x){o.qty=x.qty;if(o.unit!=='')o.gross=o.unit*x.qty}if('note' in x)o.note=x.note}o.pending=true}}
  else if(it.action==='addPayment'){v.payments.push({customer:x.customer,amount:x.amount,date:x.date,shipOnly:x.shipOnly?'Yes':'',note:x.note||'',pending:true});
   c=by(v.customers,'name',x.customer);if(c&&num(c.balance)!=null)c.balance=num(c.balance)-x.amount}
  else if(it.action==='upsertPurchase'){sh=by(v.shopping,'product',x.product);if(sh){sh.bought=x.bought;sh.paidYen=x.paidYen;sh.soldOut=x.soldOut?'Sold Out':'';
   sh.toBuy=Math.max(0,(num(sh.need)||0)-(num(x.bought)||0));sh.pending=true}}
 });
 return v;
}
function recalc(){VW=D?applyQueue(D,Q):null}
recalc();
function chip(t,kind){if(t===''||t==null)return '';if(!kind){var s=String(t).toLowerCase();
 kind=/payment required/.test(s)?'bad':/(collect|unpaid|keep shopping|waiting|partial|pending)/.test(s)?'warn':/(overpaid|refund|new)/.test(s)?'info':/(sold out|cancel)/.test(s)?'bad':/^(paid|bought|done|delivered|shipped|trusted|ready)/.test(s)?'good':''}
 return '<span class="chip '+kind+'">'+esc(t)+'</span>'}
function has(s,q){return String(s==null?'':s).toLowerCase().indexOf(q)>-1}
function det(pairs){return '<div class="det">'+pairs.map(function(p){return '<div><span>'+esc(p[0])+'</span><span>'+p[1]+'</span></div>'}).join('')+'</div>'}
function when(){if(!AT)return 'Never synced';var d=new Date(AT);return 'Synced '+d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function cid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function enqueue(action,data,label){Q.push({cid:cid(),action:action,data:data,label:label,at:Date.now()});saveQ();recalc()}

/* ---------- sync ---------- */
function acceptData(d){D=d;AT=new Date().toISOString();ls.set('oc_data',JSON.stringify(D));ls.set('oc_at',AT);recalc()}
function sync(retry){
 if(!cfg.url||!cfg.key){S.setup=true;render();return Promise.resolve()}
 if(S.loading)return Promise.resolve();
 if(retry)Q.forEach(function(it){delete it.err});
 var sending=Q.filter(function(it){return !it.err});
 S.loading=true;S.msg='';render();
 var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},60000),p;
 if(sending.length){
  p=fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,
   body:JSON.stringify({key:cfg.key,items:sending.map(function(it){return {cid:it.cid,action:it.action,data:it.data}})})})
  .then(function(r){return r.json()}).then(function(j){
   if(!j.ok)throw new Error(j.error||'Unknown error');
   var res={};j.results.forEach(function(r){res[r.cid]=r});
   Q=Q.filter(function(it){var r=res[it.cid];if(!r)return true;if(r.ok)return false;it.err=r.error;return true});
   saveQ();acceptData(j.data);
   var n=Q.filter(function(it){return it.err}).length;S.msg=n?n+' item(s) need attention. Tap Pending.':''});
 }else{
  p=fetch(cfg.url+'?action=snapshot&key='+encodeURIComponent(cfg.key),{signal:ctl.signal})
  .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Unknown error');acceptData(j.data);S.msg=''});
 }
 return p.catch(function(e){S.msg=(navigator.onLine?'Could not sync ('+e.message+'). ':'Offline. ')+(Q.length?'Your entries are saved on this phone.':'Showing saved data.')})
 .then(function(){clearTimeout(t);S.loading=false;render();
  if(Q.some(function(it){return !it.err&&sending.indexOf(it)<0})&&navigator.onLine)setTimeout(function(){sync()},200)});
}
function afterSave(){closeOv();render();if(navigator.onLine)sync()}

/* ---------- main views ---------- */
function stat(k,v){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'}
function home(){
 var d=VW,h=d.home,a=h.actions,u=h.units,m=h.money,p=h.people;
 var prog=Math.max(0,Math.min(100,Math.round((num(u.progress)||0)*100)));
 var checks=h.checks.filter(function(c){return c.label==='Overall'})[0];
 return '<div class="card"><div class="row"><div><b>'+val(d.settings.batch)+'</b><div class="k">Ship from '+val(d.settings.shipFrom)+'</div></div><div style="text-align:right"><b>'+val(h.daysText)+'</b><div class="k">Rate '+val(h.rate)+'</div></div></div>'
 +'<div class="btns"><button class="btn" data-act="calc">Calculator</button><button class="btn" data-act="newOrder">+ Order</button><button class="btn" data-act="newPayment">+ Payment</button></div></div>'
 +'<div class="sec">Current overview</div><div class="grid">'
 +stat('Collect payment',val(a.collect)+(num(a.onHold)?' <span class="k">('+esc(a.onHold)+' required to continue)</span>':''))
 +stat('Still waiting on items to shop',val(a.waitingItems))
 +stat('Customers ready to pack',val(a.readyToPack))
 +stat('Overpaid: refund or apply to shipping',val(a.overpaid))
 +'</div><div class="card"><div class="row"><span class="k">Shipping fees to collect</span><b>'+val(a.shippingToCollect)+'</b></div></div>'
 +'<div class="sec">Shopping progress</div><div class="card"><div class="row"><span>'+val(u.bought)+' bought of '+val(u.ordered)+' ordered</span><b>'+prog+'%</b></div><div class="bar"><i style="width:'+prog+'%"></i></div><div class="k" style="margin-top:6px">Still to buy: '+val(u.toBuy)+' units</div></div>'
 +'<div class="sec">Money</div><div class="card">'
 +'<div class="row"><span class="k">Billable items</span><b>'+rp(m.billable)+'</b></div>'
 +'<div class="row"><span class="k">Collected</span><b>'+rp(m.collected)+'</b></div>'
 +'<div class="row"><span class="k">Still to collect</span><b>'+rp(m.toCollect)+'</b></div>'
 +'<div class="row"><span class="k">Credit / refunds due</span><b>'+rp(m.credit)+'</b></div>'
 +'<div class="row"><span class="k">Realised profit</span><b>'+rp(p.profit)+' <span class="k">('+pct(p.margin)+')</span></b></div></div>'
 +'<div class="sec">Shopping by store</div><div class="card">'+(h.stores.length?h.stores.map(function(s){return '<div class="row"><span>'+esc(s.store)+'</span><span class="k">to buy '+val(s.toBuy)+' | bought '+val(s.bought)+'</span></div>'}).join(''):'<span class="k">No data</span>')+'</div>'
 +'<div class="sec">Customers</div><div class="card"><div class="row"><span class="k">Total customers</span><b>'+val(p.customers)+'</b></div>'
 +h.pipeline.filter(function(x){return num(x.customers)}).map(function(x){return '<div class="row"><span class="k">'+esc(x.label)+'</span><b>'+esc(x.customers)+'</b></div>'}).join('')+'</div>'
 +(checks?'<div class="sec">Data check</div><div class="card"><div class="row"><b class="'+(/all clear/i.test(checks.value)?'t-done':'t-buy')+'">'+val(checks.value)+'</b></div>'
 +h.checks.filter(function(x){return x.label!=='Overall'&&num(x.value)>0}).map(function(x){return '<div class="row" style="margin-top:6px"><span class="k">'+esc(x.label)+'</span><b>'+esc(x.value)+'</b></div>'}).join('')+'</div>':'');
}
function bar(ph){return '<input id="q" type="search" placeholder="'+esc(ph)+'" value="'+esc(S.q)+'" autocomplete="off">'}
function pend(x){return x.pending?chip('Pending','info'):''}
function catalog(){return bar('Search product or store')+'<div id="list">'+catalogList()+'</div>'}
function catalogList(){
 var q=S.q.toLowerCase();
 return VW.products.filter(function(p){return !q||has(p.name,q)||has(p.store,q)}).map(function(p){var id='p'+p.name,o=S.open[id];
  return '<div class="card item" data-open="'+esc(id)+'"><div class="row"><b>'+esc(p.name)+pend(p)+'</b><b>'+(p.selling!==''?rp(p.selling):'-')+'</b></div>'
  +'<div class="sub">'+esc(p.store)+' | '+yen(p.yen)+(num(p.ordered)?' | ordered '+esc(p.ordered):'')+(p.ig==='Posted'?' | posted':'')+'</div>'
  +(o?det([['Surcharge',rp(p.surcharge||0)],['Manual IDR price',p.manualIdr===''?'-':rp(p.manualIdr)],['IG label',val(p.label)],['Est. buying cost',rp(p.cost)],['Est. profit',rp(p.profit)+' ('+pct(p.margin)+')'],['IG status',val(p.ig)],['Notes',val(p.notes)],['Link',p.link?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">Open</a>':'-']])
   +'<div class="btns"><button class="btn ghost sm" data-act="editProduct" data-name="'+esc(p.name)+'">Edit</button><button class="btn ghost sm" data-act="newOrder" data-name="'+esc(p.name)+'" data-kind="product">Order this</button></div>':'')+'</div>'}).join('')||'<div class="k">Nothing found</div>';
}
function customers(){return bar('Search customer')+'<div id="list">'+customerList()+'</div>'}
function customerList(){
 var q=S.q.toLowerCase();
 return VW.customers.filter(function(c){return !q||has(c.name,q)}).map(function(c){var id='c'+c.name,o=S.open[id],lines='',pays='';
  if(o){lines=VW.orders.filter(function(x){return x.customer===c.name}).map(function(x){return [esc(x.product)+' x'+esc(x.qty),chip(x.status)]});
   pays=VW.payments.filter(function(x){return x.customer===c.name}).map(function(x){return [esc(x.date),rp(x.amount)+(x.shipOnly==='Yes'?' (shipping)':'')]})}
  return '<div class="card item" data-open="'+esc(id)+'"><div class="row" style="align-items:flex-start"><div class="nm"><b>'+esc(c.name)+'</b>'+(c.type?'<span class="customer-type">'+esc(c.type)+'</span>':'<span class="customer-type">No type</span>')+pend(c)+'</div><b>'+rp(c.balance)+'</b></div>'
  +'<div class="chips">'+chip(c.next)+chip(c.status,'')+'</div>'
  +(o?det([['Contact',val(c.contact)],['Address',val(c.address)],['Courier',val(c.courier)],['Units (active / bought / waiting / to buy)',val(c.units)+' / '+val(c.bought)+' / '+val(c.waiting)+' / '+val(c.toBuy)],['Billable items',rp(c.billable)],['Items paid',rp(c.itemsPaid)],['Shipping fee / paid',rp(c.shipFee)+' / '+rp(c.shipPaid)],['Payment status',val(c.payStatus)],['Notes',val(c.notes)]])
   +(lines.length?det([['Order lines','']].concat(lines)):'')+(pays.length?det([['Payments','']].concat(pays)):'')
   +'<div class="btns"><button class="btn ghost sm" data-act="editCustomer" data-name="'+esc(c.name)+'">Edit</button><button class="btn ghost sm" data-act="newOrder" data-name="'+esc(c.name)+'" data-kind="customer">+ Order</button><button class="btn ghost sm" data-act="newPayment" data-name="'+esc(c.name)+'">+ Payment</button></div>':'')+'</div>'}).join('')||'<div class="k">Nothing found</div>';
}
function orders(){return bar('Search customer or product')+'<div id="list">'+orderList()+'</div>'}
function orderList(){
 var q=S.q.toLowerCase();
 return VW.orders.slice().reverse().filter(function(o){return !q||has(o.customer,q)||has(o.product,q)}).map(function(o){

function invoiceMessage(name){
 var c=by(VW.customers,'name',name);if(!c)return '';
 var orders=VW.orders.filter(function(o){return o.customer===name&&o.cancel!=='Yes'});
 var pays=VW.payments.filter(function(p){return p.customer===name});
 var items=orders.reduce(function(a,o){return a+(num(o.billable)!=null?num(o.billable):(num(o.gross)||0))},0);
 var shipping=num(c.shipFee)||0,paid=pays.reduce(function(a,p){return a+(num(p.amount)||0)},0);
 var total=items+shipping,balance=total-paid;
 var lines=['Hi '+name+',','Here is your Overhead Cabin order recap:'];
 if(orders.length){lines.push('Items:');orders.forEach(function(o){lines.push('• '+o.product+' × '+(o.qty||1)+' — '+rp(o.billable!=null&&o.billable!==''?o.billable:o.gross))})}
 lines.push('Items total: '+rp(items));
 if(shipping)lines.push('Shipping fee: '+rp(shipping));
 lines.push('Total: '+rp(total),'Payment received: '+rp(paid),'Balance: '+rp(balance));
 lines.push('Thank you for shopping with Overhead Cabin!');
 return lines.join('\\n');
}
function downloadInvoiceImage(name){
 var c=by(VW.customers,'name',name);if(!c){alert('Choose a customer first.');return}
 var orders=VW.orders.filter(function(o){return o.customer===name&&o.cancel!=='Yes'}),pays=VW.payments.filter(function(p){return p.customer===name});
 var itemTotal=orders.reduce(function(a,o){return a+(num(o.billable)!=null?num(o.billable):(num(o.gross)||0))},0);
 var ship=num(c.shipFee)||0,paid=pays.reduce(function(a,p){return a+(num(p.amount)||0)},0),total=itemTotal+ship,bal=total-paid;
 var width=900,pad=58,rowH=54,headerH=230,summaryH=210,height=headerH+Math.max(orders.length,1)*rowH+Math.max(pays.length,1)*rowH+summaryH+80;
 var canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
 var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
 ctx.fillStyle='#16202e';ctx.font='bold 30px Arial';ctx.fillText('INVOICE',pad,58);
 ctx.fillStyle='#6b7685';ctx.font='20px Arial';ctx.fillText('OVERHEAD CABIN',pad,92);
 ctx.font='18px Arial';ctx.fillText('Customer: '+name,pad,145);ctx.fillText('Date: '+new Date().toLocaleDateString(),pad,178);
 var y=headerH;
 function section(title){ctx.fillStyle='#16202e';ctx.font='bold 22px Arial';ctx.fillText(title,pad,y);y+=28}
 function line(text,x,yy,font,color){ctx.font=font||'18px Arial';ctx.fillStyle=color||'#16202e';ctx.fillText(String(text),x,yy)}
 function rule(){ctx.strokeStyle='#e3e6ea';ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(width-pad,y);ctx.stroke();y+=rowH}
 section('Items');
 line('Item',pad,y,'bold 16px Arial','#6b7685');line('Qty',width-pad-220,y,'bold 16px Arial','#6b7685');line('Amount',width-pad-130,y,'bold 16px Arial','#6b7685');y+=22;rule();
 if(!orders.length){line('No items recorded',pad,y);y+=rowH;rule()}
 orders.forEach(function(o){line(o.product,pad,y);line(o.qty||1,width-pad-220,y);line(rp(o.billable!=null&&o.billable!==''?o.billable:o.gross),width-pad-130,y);y+=22;rule()});
 y+=12;section('Payments');
 line('Date / type',pad,y,'bold 16px Arial','#6b7685');line('Note',width-pad-360,y,'bold 16px Arial','#6b7685');line('Amount',width-pad-130,y,'bold 16px Arial','#6b7685');y+=22;rule();
 if(!pays.length){line('No payments recorded',pad,y);y+=rowH;rule()}
 pays.forEach(function(p){line((p.date||'')+(p.shipOnly==='Yes'?' · Shipping':' · Payment'),pad,y);line(p.note||'',width-pad-360,y);line(rp(p.amount),width-pad-130,y);y+=22;rule()});
 y+=24;ctx.font='bold 20px Arial';ctx.fillStyle='#16202e';ctx.fillText('Items total: '+rp(itemTotal),pad,y);y+=36;ctx.fillText('Shipping: '+rp(ship),pad,y);y+=36;ctx.fillText('Total: '+rp(total),pad,y);y+=36;ctx.fillText('Paid: '+rp(paid),pad,y);y+=36;ctx.fillText('Balance: '+rp(bal),pad,y);y+=60;
 ctx.font='16px Arial';ctx.fillStyle='#6b7685';ctx.fillText('Thank you for shopping with Overhead Cabin.',pad,y);
 // Draw the uploaded brand mark in the header after canvas content is ready.
 var logo=document.querySelector('.invoice-logo');
 function finish(){
   if(logo&&logo.complete&&logo.naturalWidth){ctx.drawImage(logo,width-pad-190,28,150,150)}
   canvas.toBlob(function(blob){
     if(!blob){alert('Could not create invoice image. Please try again.');return}
     var file=new File([blob],'OverheadCabin-Invoice-'+name.replace(/[^a-z0-9]+/gi,'-')+'.png',{type:'image/png'});
     if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
       navigator.share({files:[file],title:'Overhead Cabin Invoice'}).catch(function(){});
     }else{
       var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500);
     }
   },'image/png');
 }
 if(logo&&logo.complete&&logo.naturalWidth)finish();else if(logo)logo.onload=finish;else finish();
}

function render(){

 else if(!VW){body='<div class="card">'+(S.loading?'Loading from your sheet...':'No saved data yet.')+'</div>'+(S.msg?'<div class="toast">'+esc(S.msg)+'</div>':'')}
 else{body=(S.msg?'<div class="toast">'+esc(S.msg)+'</div>':'')+VIEWS[S.tab]()}

function savePayment(){
 var cn=val$('f_cust'),c=by(VW.customers,'name',cn),amt=Number(val$('f_amt'));
 if(!c){alert('Customer not found. Add the customer first (Customers tab).');return}
 if(!(amt>0)){alert('Enter an amount above 0');return}
 enqueue('addPayment',{customer:c.name,amount:amt,date:val$('f_date')||today(),shipOnly:$('#f_ship').checked,note:val$('f_note')},'Payment: '+c.name+' '+rp(amt));afterSave();
}
function paymentByRow(row){var p=null;VW.payments.forEach(function(x){if(Number(x.row)===Number(row))p=x});return p}
function openPaymentEdit(row){var p=paymentByRow(row);if(!p)return;showOv(head('Edit payment')+inp('Customer','f_cust','text',p.customer,'readonly')+inp('Amount (Rp)','f_amt','number',p.amount,'inputmode="numeric"')+inp('Date','f_date','date',p.date||today())+'<label class="tgl"><input type="checkbox" id="f_ship"'+(p.shipOnly==='Yes'?' checked':'')+'> Shipping fee only</label>'+inp('Note (optional)','f_note','text',p.note||'')+'<button class="btn" data-act="savePaymentEdit" data-row="'+row+'" style="width:100%">Save changes</button>')}
function savePaymentEdit(row){var p=paymentByRow(row),amt=Number(val$('f_amt'));if(!p)return;if(!(amt>0)){alert('Enter an amount above 0');return}enqueue('updatePayment',{row:row,expectCustomer:p.customer,expectAmount:p.amount,customer:p.customer,amount:amt,date:val$('f_date')||today(),shipOnly:$('#f_ship').checked,note:val$('f_note')},'Edit payment: '+p.customer+' '+rp(amt));afterSave()}
function deletePayment(row){var p=paymentByRow(row);if(!p)return;if(!confirm('Delete this payment of '+rp(p.amount)+' from '+p.customer+'?'))return;enqueue('deletePayment',{row:row,expectCustomer:p.customer,expectAmount:p.amount},'Delete payment: '+p.customer+' '+rp(p.amount));afterSave()}
function openProduct(name){
 var p=name?by(VW.products,'name',name):null,s=VW.settings;
 showOv(head(p?'Edit product':'New product')+inp('Name','f_name','text',p?p.name:'',p?'readonly':'autocapitalize="words"')
  +selx('Store','f_store',storeOpts(),p?p.store:'','(choose)')+inp('Or type a new store','f_newstore','text','')
  +inp('Price in yen','f_yen','number',p?p.yen:'','inputmode="decimal"')+selx('Bulky surcharge','f_sur',surOpts(),p?p.surcharge:'','(none)')
  +inp('Manual IDR price (optional)','f_man','number',p?p.manualIdr:'','inputmode="numeric"')+inp('Link','f_link','url',p?p.link:'','autocapitalize="off"')
  +selx('IG status','f_ig',['Not posted','Posted','Skip'],p?p.ig:'Not posted')+inp('Notes','f_notes','text',p?p.notes:'')
  +'<button class="btn" data-act="saveProduct" data-edit="'+(p?'1':'')+'" style="width:100%">Save product</button>');
}
function saveProduct(edit){
 var name=val$('f_name'),ns=val$('f_newstore'),store=ns||val$('f_store'),yv=numOrBlank('f_yen'),man=numOrBlank('f_man');
 if(!name){alert('Name is required');return}
 if(!edit&&by(VW.products,'name',name)){alert('This product already exists. Open it in the Catalog and tap Edit.');return}
 if(!(yv>0)&&!(man>0)){alert('Enter a yen price or a manual IDR price');return}
 if(ns&&VW.settings.stores.map(lc).indexOf(lc(ns))<0)enqueue('addStore',{name:ns},'New store: '+ns);
 var d={name:name,store:store,yen:yv,surcharge:numOrBlank('f_sur'),manualIdr:man,link:val$('f_link'),ig:val$('f_ig'),notes:val$('f_notes')};
 enqueue(edit?'updateProduct':'addProduct',d,(edit?'Edit product: ':'New product: ')+name);afterSave();
}
function openCustomer(name){
 var c=name?by(VW.customers,'name',name):null,s=VW.settings;
 showOv(head(c?'Edit customer':'New customer')+inp('Name','f_name','text',c?c.name:'',c?'readonly':'autocapitalize="words"')
  +selx('Type','f_type',['Trusted','New'],c?c.type:'New')+inp('Contact','f_contact','text',c?c.contact:'')+inp('Address','f_addr','text',c?c.address:'')
  +selx('Courier','f_cour',s.couriers,c?c.courier:'','(not chosen)')+inp('Shipping fee (Rp)','f_fee','number',c?c.shipFee:'','inputmode="numeric"')
  +selx('Status','f_status',['Shopping','Ready to Pack','Packed','Shipped','Delivered'],c?c.status:'Shopping')+inp('Notes','f_notes','text',c?c.notes:'')
  +'<button class="btn" data-act="saveCustomer" data-edit="'+(c?'1':'')+'" style="width:100%">Save customer</button>');
}
function saveCustomer(edit){
 var name=val$('f_name');if(!name){alert('Name is required');return}
 if(!edit&&by(VW.customers,'name',name)){alert('This customer already exists. Open them in Customers and tap Edit.');return}
 var d={name:name,type:val$('f_type'),contact:val$('f_contact'),address:val$('f_addr'),courier:val$('f_cour'),shipFee:numOrBlank('f_fee'),status:val$('f_status'),notes:val$('f_notes')};
 enqueue(edit?'updateCustomer':'addCustomer',d,(edit?'Edit customer: ':'New customer: ')+name);afterSave();
}
function openBuy(name){
 var s=by(VW.shopping,'product',name);if(!s)return;
 showOv(head('Log purchase')+'<div style="margin-bottom:8px"><b>'+esc(s.product)+'</b><div class="sub">'+esc(s.store)+' | need now '+val(s.need)+' | waiting payment '+val(s.waiting)+'</div></div>'
  +'<label class="k">Bought so far (total)</label><div class="step"><button class="btn ghost" data-act="dec">-</button>'+'<input id="f_b" type="number" inputmode="numeric" value="'+esc(s.bought)+'"><button class="btn ghost" data-act="inc">+</button></div>'
  +inp('Paid so far in yen (total)','f_p','number',s.paidYen,'inputmode="decimal"')
  +'<label class="tgl"><input type="checkbox" id="f_out"'+(s.soldOut==='Sold Out'?' checked':'')+'> Can\'t get more (sold out)</label>'
  +'<button class="btn" data-act="saveBuy" data-name="'+esc(s.product)+'" style="width:100%">Save</button>');
}
function saveBuy(name){
 var b=numOrBlank('f_b'),p=numOrBlank('f_p');
 enqueue('upsertPurchase',{product:name,bought:b,paidYen:p,soldOut:$('#f_out').checked},'Bought: '+name+' '+(b===''?'-':b));afterSave();
}
function openOrderEdit(row){
 var o=null;VW.orders.forEach(function(x){if(x.row===row)o=x});if(!o)return;
 showOv(head('Edit order line')+'<div style="margin-bottom:8px"><b>'+esc(o.customer)+'</b><div class="sub">'+esc(o.product)+'</div></div>'
  +inp('Qty','f_qty','number',o.qty,'inputmode="numeric" min="1"')+inp('Note','f_note','text',o.note)
  +'<div class="btns"><button class="btn" data-act="saveOrderEdit" data-row="'+row+'">Save</button><button class="btn warn" data-act="cancelLine" data-row="'+row+'">Cancel this line</button></div>');
}
function orderByRow(row){var o=null;VW.orders.forEach(function(x){if(x.row===row)o=x});return o}
function saveOrderEdit(row){
 var o=orderByRow(row),qty=Number(val$('f_qty'));if(!o)return;if(!(qty>0)){alert('Quantity must be 1 or more');return}
 enqueue('updateOrder',{row:row,expectCustomer:o.customer,expectProduct:o.product,qty:qty,note:val$('f_note')},'Edit order: '+o.customer+', '+o.product);afterSave();
}
function cancelLine(row){
 var o=orderByRow(row);if(!o)return;if(!confirm('Cancel this order line for '+o.customer+'?'))return;
 enqueue('cancelOrder',{row:row,expectCustomer:o.customer,expectProduct:o.product},'Cancel order: '+o.customer+', '+o.product);afterSave();
}
function openPending(){
 showOv(head('Pending on this phone')+(Q.length?Q.map(function(it,i){return '<div class="card"><div>'+esc(it.label||it.action)+'</div>'
  +(it.err?'<div class="err">'+esc(it.err)+'</div>':'<div class="sub">Waiting to sync</div>')+'<div class="btns"><button class="btn ghost sm" data-act="discard" data-i="'+i+'">Discard</button></div></div>'}).join('')
  +'<button class="btn" data-act="retry" style="width:100%">Retry now</button>':'<p class="k">Nothing pending.</p>'));
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 if(e.target.classList&&e.target.classList.contains('overlay')){closeOv();return}
 var t=e.target.closest('[data-tab],[data-act],[data-open]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.q='';render();var m=$('#main');if(m)m.scrollTop=0;return}
 if(t.dataset.open){if(e.target.closest('[data-act],a'))return;S.open[t.dataset.open]=!S.open[t.dataset.open];$('#list').innerHTML=LISTS[S.tab]();return}
 var a=t.dataset.act,n=t.dataset.name,r=t.dataset.row?Number(t.dataset.row):0;
 if(a==='sync'){S.setup=false;sync(true)}
 else if(a==='setup'){S.setup=true;render()}
 else if(a==='cancelSetup'){S.setup=false;render()}
 else if(a==='save'){var u=$('#cu').value.trim(),k=$('#ck').value.trim();
  if(u.indexOf('https://script.google.com/')!==0){alert('The URL should start with https://script.google.com/');return}
  if(!k){alert('Please enter your secret key');return}
  cfg={url:u,key:k};ls.set('oc_url',u);ls.set('oc_key',k);S.setup=false;sync()}
 else if(a==='closeOv')closeOv();
 else if(!VW&&a!=='pend'){return}
 else if(a==='calc'){openCalc();if(VW&&VW.settings)calcUpdate()}
 else if(a==='newOrder'){openOrder(t.dataset.kind==='product'?{product:n}:t.dataset.kind==='customer'?{customer:n}:null)}
 else if(a==='saveOrder')saveOrder();
 else if(a==='newPayment'){openPayment(n?{customer:n}:null)}
 else if(a==='savePayment')savePayment();
 else if(a==='editPayment')openPaymentEdit(r);
 else if(a==='savePaymentEdit')savePaymentEdit(r);
 else if(a==='deletePayment')deletePayment(r);
 else if(a==='downloadInvoiceImage'){downloadInvoiceImage(S.invoiceCustomer||($('#invoiceCustomer')?$('#invoiceCustomer').value:''))}
 else if(a==='copyInvoice'){var im=invoiceMessage(S.invoiceCustomer||($('#invoiceCustomer')?$('#invoiceCustomer').value:''));if(im&&navigator.clipboard)navigator.clipboard.writeText(im).then(function(){alert('Message copied.')},function(){prompt('Copy this message:',im)});else prompt('Copy this message:',im)}
 else if(a==='newProduct')openProduct();
 else if(a==='editProduct')openProduct(n);
 else if(a==='saveProduct')saveProduct(!!t.dataset.edit);
 else if(a==='newCustomer')openCustomer();
 else if(a==='editCustomer')openCustomer(n);
 else if(a==='saveCustomer')saveCustomer(!!t.dataset.edit);
 else if(a==='logBuy')openBuy(n);
 else if(a==='saveBuy')saveBuy(n);
 else if(a==='inc'||a==='dec'){var f=$('#f_b'),c=Number(f.value)||0;f.value=Math.max(0,c+(a==='inc'?1:-1))}
 else if(a==='editOrder')openOrderEdit(r);
 else if(a==='saveOrderEdit')saveOrderEdit(r);
 else if(a==='cancelLine')cancelLine(r);
 else if(a==='pend')openPending();
 else if(a==='discard'){Q.splice(Number(t.dataset.i),1);saveQ();recalc();render();openPending()}
 else if(a==='retry'){closeOv();sync(true)}
});
document.addEventListener('input',function(e){
 var id=e.target.id;
 if(id==='q'){S.q=e.target.value;$('#list').innerHTML=LISTS[S.tab]()}
 else if(id==='c1'||id==='c2'){calcUpdate()}
 else if(id==='f_cust'||id==='f_prod'){if(form==='order')orderHints()}
});
document.addEventListener('change',function(e){
 if(e.target.id==='onlyBuy'){S.onlyBuy=e.target.checked;$('#list').innerHTML=shopList()}
 else if(e.target.id==='invoiceCustomer'){S.invoiceCustomer=e.target.value;render()}
 else if(e.target.id==='c3'){calcUpdate()}
});
window.addEventListener('online',function(){if(cfg.url&&cfg.key)sync()});

render();
if(cfg.url&&cfg.key)sync();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
